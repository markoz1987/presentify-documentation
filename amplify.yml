version: 1
frontend:
  phases:
    build:
      commands:
        - echo "Static site - nothing to build"
  artifacts:
    baseDirectory: public
    files:
      - "**/*"
  cache:
    paths: []
customHeaders:
  # Screenshots are content-addressed by filename: safe to cache for a year.
  - pattern: "/img/**"
    headers:
      - key: Cache-Control
        value: "public, max-age=31536000, immutable"
  # The document itself must never be served stale.
  - pattern: "/index.html"
    headers:
      - key: Cache-Control
        value: "public, max-age=0, must-revalidate"
  - pattern: "/**"
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Content-Security-Policy
        value: "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; frame-src https://player.vimeo.com; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'"
